name: IndexNow URL Submission

on:
  push:
    branches:
      - main

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract URLs from sitemap and submit to IndexNow
        run: |
          INDEXNOW_KEY="f93672af4d34479db1514d267820c7be"
          SITE_URL="https://aironeheatingandcoolinginc.com"

          echo "Extracting URLs from sitemap.xml..."
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml)

          if [ -z "$URLS" ]; then
            echo "ERROR: No URLs found in sitemap.xml. Aborting."
            exit 1
          fi

          URL_COUNT=$(echo "$URLS" | wc -l)
          echo "Found $URL_COUNT URLs. Submitting to IndexNow..."

          # Build JSON array
          URL_JSON=$(echo "$URLS" | jq -R . | jq -sc .)

          PAYLOAD=$(jq -n \
            --arg host "aironeheatingandcoolinginc.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$SITE_URL/$INDEXNOW_KEY.txt" \
            --argjson urlList "$URL_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Payload preview (first 500 chars):"
          echo "$PAYLOAD" | head -c 500

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ]; then
            echo "SUCCESS: IndexNow submission accepted."
          else
            echo "WARNING: Unexpected HTTP status $HTTP_STATUS. Check response above."
          fi
