name: IndexNow URL Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | python3 -c "
          import sys, json, os, urllib.request
          urls = [u.strip() for u in sys.stdin if u.strip()]
          key = os.environ['INDEXNOW_KEY']
          host = 'aironeheatingandcoolinginc.com'
          key_location = f'https://{host}/{key}.txt'
          payload = json.dumps({'host': host, 'key': key, 'keyLocation': key_location, 'urlList': urls}).encode('utf-8')
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload, headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
          try:
            with urllib.request.urlopen(req) as res:
              print(f'IndexNow response: {res.status}')
              print('Submission accepted.')
          except urllib.error.HTTPError as e:
            print(f'IndexNow response: {e.code}')
            print(e.read().decode())
          "
