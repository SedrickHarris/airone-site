name: IndexNow URL Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | python3 -c "
          import sys, json
          urls = [u.strip() for u in sys.stdin if u.strip()]
          print(json.dumps(urls))
          ")

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"aironeheatingandcoolinginc.com\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://aironeheatingandcoolinginc.com/a62f7721c9d642bdb317f4149bbec181.txt\",\"urlList\":${URLS}}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ]; then
            echo "IndexNow response: $HTTP_STATUS"
            echo "Submission accepted."
          else
            echo "IndexNow response: $HTTP_STATUS"
            exit 1
          fi
